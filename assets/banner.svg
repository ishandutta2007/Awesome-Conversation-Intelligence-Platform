<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
      .wave-bar { animation: pulse 2s infinite ease-in-out alternate; }
      @keyframes pulse { 0% { transform: scaleY(0.4); opacity: 0.5; } 100% { transform: scaleY(1.1); opacity: 1; } }
      .pulse-1 { animation-delay: 0.1s; transform-origin: bottom; }
      .pulse-2 { animation-delay: 0.3s; transform-origin: bottom; }
      .pulse-3 { animation-delay: 0.5s; transform-origin: bottom; }
      .pulse-4 { animation-delay: 0.7s; transform-origin: bottom; }
      .pulse-5 { animation-delay: 0.9s; transform-origin: bottom; }
      .orbit-circle { animation: rotate 20s linear infinite; transform-origin: 1000px 160px; }
      @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Dynamic Dynamic Floating Elements in Background (Z-index below text) -->
  <g opacity="0.25">
    <!-- Grid pattern -->
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Animated Orbit Graphic (Background Right Side) -->
  <g opacity="0.35">
    <circle cx="1000" cy="160" r="110" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="1000" cy="160" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <g class="orbit-circle">
      <circle cx="1000" cy="50" r="8" fill="#c084fc" filter="url(#glow)"/>
      <circle cx="930" cy="160" r="6" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Dynamic Equalizer Audio Wave Form (Visualizing Speech/Audio Intelligence) -->
  <g transform="translate(820, 190)" opacity="0.8">
    <rect class="wave-bar pulse-1" x="0" y="-80" width="8" height="80" rx="4" fill="#38bdf8"/>
    <rect class="wave-bar pulse-3" x="16" y="-120" width="8" height="120" rx="4" fill="#818cf8"/>
    <rect class="wave-bar pulse-2" x="32" y="-60" width="8" height="60" rx="4" fill="#c084fc"/>
    <rect class="wave-bar pulse-5" x="48" y="-140" width="8" height="140" rx="4" fill="#f472b6"/>
    <rect class="wave-bar pulse-4" x="64" y="-90" width="8" height="90" rx="4" fill="#38bdf8"/>
    <rect class="wave-bar pulse-2" x="80" y="-110" width="8" height="110" rx="4" fill="#818cf8"/>
    <rect class="wave-bar pulse-1" x="96" y="-50" width="8" height="50" rx="4" fill="#c084fc"/>
  </g>

  <!-- Foreground Glass Container for Text - Ensures 100% contrast & non-overlapping foreground -->
  <rect x="50" y="45" width="720" height="230" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 105)">
    <!-- Pill Badge -->
    <rect x="0" y="-30" width="220" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="15" y="-11" class="badge-text" fill="#38bdf8">🎙️ AI &amp; SPEECH INTELLIGENCE</text>
    
    <!-- Title -->
    <text x="0" y="35" class="title" filter="url(#glow)">Awesome Conversation</text>
    <text x="0" y="80" class="title" fill="url(#text-grad)">Intelligence Platform 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle">Curated SaaS Platforms, AI Meeting Bots &amp; Open-Source Speech Systems</text>
  </g>

  <!-- Floating Decorative Icons -->
  <g transform="translate(1080, 80)">
    <rect width="60" height="60" rx="16" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="16" y="38" font-size="28">🧠</text>
  </g>
</svg>
